services:
  board:
    build: .
    image: mr-emoji-board
    ports:
      - "8000:8000"
    # Re-read on `docker compose up`, so edits don't need a rebuild.
    env_file: settings.env
    # Mounted at /run/secrets/<name>, which the app reads by default.
    secrets:
      - mm_token
      - gitlab_token
    restart: unless-stopped

secrets:
  mm_token:
    file: ./secrets/mm_token
  gitlab_token:
    file: ./secrets/gitlab_token
