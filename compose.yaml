services:
  board:
    build: .
    image: mr-emoji-board
    ports:
      - "8000:8000"
    # Re-read on `docker compose up`, so edits don't need a rebuild.
    env_file: settings.env
    # Mounted at /run/secrets/<name>, which the app reads by default.
    secrets:
      - mm_client_secret
      - gitlab_token
    # Mattermost OAuth tokens, kept across restarts and rebuilds.
    volumes:
      - state:/app/state
    restart: unless-stopped

volumes:
  state:

secrets:
  mm_client_secret:
    file: ./secrets/mm_client_secret
  gitlab_token:
    file: ./secrets/gitlab_token
