<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR Emoji Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B39DF5' stroke-width='2.4' stroke-linecap='round'><circle cx='18' cy='18' r='3'/><circle cx='6' cy='6' r='3'/><path d='M6 21V9a9 9 0 0 0 9 9'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="titlebar">
    <div class="brand">
      <span class="logo"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg></span>
      <div>
        <h1>MR Emoji Board</h1>
        <div class="sub" id="sub">Harvesting reactions…</div>
      </div>
    </div>
    <div class="actions">
      <button id="refresh" class="btn" title="Re-harvest Mattermost and GitLab now">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Refresh</span>
      </button>
      <button id="theme" class="btn icon" aria-label="Toggle theme" title="Toggle theme">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <label class="user" title="Your Mattermost username: highlights your MRs and fills “Your turn”">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span class="sr">Your username</span>
        <input id="me" placeholder="Your username" size="12" autocomplete="off">
      </label>
    </div>
  </header>

  <div class="controls">
    <label class="search">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Filter MRs</span>
      <input id="q" type="search" placeholder="Filter by title, ticket, app, branch or author">
      <kbd>/</kbd>
    </label>
    <select id="proj" aria-label="Project"><option value="">All projects</option></select>
    <div class="toggles" role="group" aria-label="Quick filters">
      <button id="mine" class="toggle" aria-pressed="false">Only mine</button>
      <button id="hideDrafts" class="toggle" aria-pressed="false">Hide drafts</button>
    </div>
  </div>
  <div class="banner" id="banner"></div>

  <div class="stats" id="stats"></div>

  <div class="panels">
    <section class="panel yours" aria-labelledby="ytH">
      <div class="panel-head">
        <h2 id="ytH">Your turn</h2>
        <span class="n accent" id="yoursN"></span>
        <span class="hint">things only you can unblock</span>
      </div>
      <div id="yours"></div>
    </section>
    <section class="panel" aria-labelledby="oosH">
      <div class="panel-head">
        <h2 id="oosH">Reactions out of sync</h2>
        <span class="n warn" id="forgottenN"></span>
        <span class="hint">GitLab and Mattermost disagree</span>
      </div>
      <div id="forgotten"></div>
    </section>
  </div>

  <main class="board" id="board"><div class="loading">Loading the board…</div></main>
</div>
<script src="app.js"></script>
</body>
</html>
