[project]
name = "mr-emoji-board"
version = "0.1.0"
description = "MR review board built from emoji reactions in the tools-reviews Mattermost channel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
mr-board-harvest = "mr_board.harvest:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mr_board"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
